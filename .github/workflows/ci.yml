name: CI

on:
  push:
    branches: [main, developing]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Fermetta/Fermetta.sln

      - name: Build
        run: dotnet build Fermetta/Fermetta.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Fermetta/Fermetta.sln --no-build --configuration Release --verbosity normal
